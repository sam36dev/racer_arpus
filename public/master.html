<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel do Mestre - Racer Arpus</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container wide">
  <h1>🏁 Painel do Mestre</h1>
  <p class="subtitle" id="game-name">Carregando...</p>
  <p>
    Codigo da corrida (compartilhe com os jogadores):
    <span class="game-code" id="game-code">------</span>
    <span class="status-pill status-lobby" id="game-status">lobby</span>
  </p>

  <div class="card card-luck">
    <h3>🎴 Cartas da Sorte</h3>
    <p class="small">Tire a carta no baralho fisico, escolha o jogador (e o oponente, se a carta pedir) e ative aqui.</p>
    <label for="luck-activate-card">Carta</label>
    <select id="luck-activate-card"></select>
    <label for="luck-activate-player" id="luck-activate-player-label">Jogador</label>
    <select id="luck-activate-player"></select>
    <div id="luck-activate-target-wrap" style="display:none;">
      <label for="luck-activate-target" id="luck-activate-target-label">Oponente (observar)</label>
      <select id="luck-activate-target"></select>
    </div>
    <button class="full-width" id="btn-activate-luck-card">Ativar carta</button>
    <div id="luck-activate-error" class="danger-banner" style="display:none;"></div>

    <div class="bar-label mt-24"><span>Historico</span></div>
    <div class="luck-log-list" id="luck-log-list"></div>
  </div>

  <div class="card">
    <h3>Adicionar jogador</h3>
    <div class="btn-row">
      <input type="text" id="new-player-name" placeholder="Nome do piloto" />
      <button id="btn-add-player">Adicionar</button>
    </div>
  </div>

  <div id="winner-banner" class="card" style="display:none; text-align:center; background:#0d3a2a;">
    <h2 id="winner-text"></h2>
  </div>

  <div class="player-grid" id="player-grid"></div>
</div>

<script src="/js/game-calc.js"></script>
<script type="module" src="/js/master.js"></script>
</body>
</html>
