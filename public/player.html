<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu carro - Racer Arpus</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container">
  <div class="player-header">
    <div class="color-dot" id="p-color"></div>
    <h2 id="p-name">Carregando...</h2>
  </div>
  <p class="small" id="p-game-status"></p>

  <div id="dice-result" class="dice-result" style="display:none;"></div>
  <button id="btn-roll" class="dice-btn">🎲 Rolar dado</button>
  <div id="roll-error" class="danger-banner" style="display:none;"></div>

  <!-- TRANSMISSAO SEQUENCIAL: so aparece enquanto este jogador estiver observando um oponente -->
  <div id="watching-card" class="card" style="display:none;">
    <div class="stat-row"><span class="stat-icon">📡</span><h3>Observando</h3></div>
    <p class="small" id="watching-status"></p>
  </div>

  <!-- Aviso "troque de lugar!" - dispara quando o oponente observado completa o dado -->
  <div id="swap-popup" class="card card-luck" style="display:none;">
    <div class="stat-row"><span class="stat-icon">🔁</span><h3>Troque de lugar!</h3></div>
    <p class="small" id="swap-popup-text"></p>
    <button class="secondary full-width" id="btn-close-swap">Fechar</button>
  </div>

  <!-- Abas dos paineis: voce + cada adversario (nome + ultimo dado). Toque pula pro painel. -->
  <div class="panel-tabs" id="panel-tabs"></div>

  <!-- Carrossel lateral: slide 0 e o seu painel; arraste pro lado pra ver o de cada adversario -->
  <div class="panel-slider" id="panel-slider">
  <div class="panel-slide" id="slide-me">
    <!-- Mostradores (tanque, pneu, turbo, voltas, multas) - montados por dashboardHTML() em player.js,
         o mesmo usado nos paineis dos adversarios -->
    <div id="my-dash"></div>

    <!-- Acoes do proprio piloto (so existem no seu slide) -->
    <div class="card">
      <div class="btn-row">
        <button class="secondary" id="btn-refuel">⛽ Abastecer +1</button>
        <button class="secondary" id="btn-repair-tire">🛞 Reparar +1</button>
      </div>
      <button class="secondary full-width" id="btn-lap">🏁 Completei uma volta</button>
      <label for="tire-select">Trocar de marca (reseta nivel para 10)</label>
      <select id="tire-select">
        <option value="pirelli">Pirelli (a cada 20 rolagens)</option>
        <option value="continental">Continental (a cada 25 rolagens)</option>
        <option value="michelin">Michelin (a cada 30 rolagens)</option>
      </select>
      <button class="secondary full-width" id="btn-change-tire">Trocar marca do pneu</button>
    </div>

    <div class="card">
      <div class="stat-row"><span class="stat-icon">📋</span><h3>Minhas multas</h3></div>
      <div class="fines-list" id="fines-list"></div>
    </div>
  </div><!-- /slide-me -->
  </div><!-- /panel-slider -->
</div>

<script src="/js/game-calc.js"></script>
<script type="module" src="/js/player.js"></script>
</body>
</html>
