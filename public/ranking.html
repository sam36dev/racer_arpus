<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking - Racer Arpus</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .pos { font-weight: 800; width: 2.5rem; }
  .pos-1 { color: #ffd166; }
  .pos-2 { color: #cfd8dc; }
  .pos-3 { color: #d4915d; }
  .champion { margin: 12px 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
  .champion strong { color: #ffd166; font-size: 1.1rem; }
</style>
</head>
<body>
<div class="container">
  <p><a href="/index.html">&larr; Voltar</a></p>
  <h1>🏆 Ranking</h1>
  <p class="subtitle">Quem mais venceu corridas por aqui</p>

  <div class="card">
    <h3>🏁 Corrida padrao</h3>
    <p class="small">Ranking normal</p>
    <div class="champion" id="champion-padrao"></div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th class="pos">#</th><th>Piloto</th><th>Vitorias</th><th>Corridas</th></tr>
        </thead>
        <tbody id="ranking-padrao"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>🏎️ Porsche Cup</h3>
    <p class="small">So as corridas da Porsche Cup</p>
    <div class="champion" id="champion-porsche"></div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th class="pos">#</th><th>Piloto</th><th>Vitorias</th><th>Corridas</th></tr>
        </thead>
        <tbody id="ranking-porsche"></tbody>
      </table>
    </div>
  </div>

  <p class="small mt-24" id="empty-msg" style="display:none;">Ninguem tem conta ainda — crie a sua em "Entrar / Criar conta".</p>
</div>

<script src="/js/ranking.js"></script>
</body>
</html>
